name: Release Packaging

'on':
  tag:

jobs:
  package_windows:
    name: Package Windows
    uses: ./.forgejo/workflows/build.yml
    with:
      runs_on: windows-latest
      build_shell: pwsh
      rust_targets: x86_64-pc-windows-msvc
      setup_command: |
        if (-not (Get-Command jq -ErrorAction SilentlyContinue)) {
          choco install jq -y --no-progress
        }
      build_command: |
        build-helpers\windows\build-exe.bat amd64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        New-Item -ItemType Directory -Force -Path dist\releases | Out-Null
        if (Test-Path dist\releases\rtsp-viewer-windows-amd64.zip) {
          Remove-Item dist\releases\rtsp-viewer-windows-amd64.zip -Force
        }
        Compress-Archive -Path dist\windows\amd64\rtsp-viewer.exe -DestinationPath dist\releases\rtsp-viewer-windows-amd64.zip
      artifact_path: dist/releases/rtsp-viewer-windows-amd64.zip
      release_body: |
        Automated cross-platform release assets for RTSP Viewer.

        Assets:
        - Windows: `rtsp-viewer-windows-amd64.zip`
        - macOS: `rtsp-viewer-macos-app.zip`
        - Linux: `rtsp-viewer-linux-x86_64.tar.gz`

        macOS note:
        After unzipping `RTSP Viewer.app`, remove the quarantine flag before first launch:
        `xattr -dr com.apple.quarantine "/path/to/RTSP Viewer.app"`

  package_macos:
    name: Package macOS
    uses: ./.forgejo/workflows/build.yml
    with:
      runs_on: macos-latest
      build_shell: bash
      build_command: |
        set -euo pipefail
        ./build-helpers/mac/build-app.sh
        mkdir -p dist/releases
        rm -f dist/releases/rtsp-viewer-macos-app.zip
        ditto -c -k --sequesterRsrc --keepParent "dist/macos/RTSP Viewer.app" "dist/releases/rtsp-viewer-macos-app.zip"
      artifact_path: dist/releases/rtsp-viewer-macos-app.zip
      release_body: |
        Automated cross-platform release assets for RTSP Viewer.

        Assets:
        - Windows: `rtsp-viewer-windows-amd64.zip`
        - macOS: `rtsp-viewer-macos-app.zip`
        - Linux: `rtsp-viewer-linux-x86_64.tar.gz`

        macOS note:
        After unzipping `RTSP Viewer.app`, remove the quarantine flag before first launch:
        `xattr -dr com.apple.quarantine "/path/to/RTSP Viewer.app"`

  package_linux:
    name: Package Linux
    uses: ./.forgejo/workflows/build.yml
    with:
      runs_on: ubuntu-22.04
      build_shell: bash
      setup_command: |
        set -euo pipefail
        docker version >/dev/null
      build_command: |
        set -euo pipefail
        BUILD_PLATFORM=linux/amd64 ./build-helpers/linux/build-tarball.sh
        mkdir -p dist/releases
        linux_tarball="$(ls -t dist/linux/rtsp-viewer-*-linux-x86_64.tar.gz | head -n 1)"
        if [ -z "${linux_tarball}" ]; then
          echo "Linux tarball build did not produce an x86_64 archive." >&2
          exit 1
        fi
        cp "${linux_tarball}" dist/releases/rtsp-viewer-linux-x86_64.tar.gz
      artifact_path: dist/releases/rtsp-viewer-linux-x86_64.tar.gz
      release_body: |
        Automated cross-platform release assets for RTSP Viewer.

        Assets:
        - Windows: `rtsp-viewer-windows-amd64.zip`
        - macOS: `rtsp-viewer-macos-app.zip`
        - Linux: `rtsp-viewer-linux-x86_64.tar.gz`

        macOS note:
        After unzipping `RTSP Viewer.app`, remove the quarantine flag before first launch:
        `xattr -dr com.apple.quarantine "/path/to/RTSP Viewer.app"`
