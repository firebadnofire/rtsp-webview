name: Release Packaging

'on':
  push:
    tags:
      - 'v*'

env:
  GITHUB_MIRROR_REPOSITORY: firebadnofire/rtsp-webview
  RELEASE_SIGNING_KEY_FINGERPRINT: 7D6EF134D851C8DA0862D97494F31AF374E2EE3C
  RELEASE_BODY: |
    Automated cross-platform release assets for RTSP Viewer.

    Assets:
    - Windows portable: `rtsp-viewer-windows-amd64-portable.zip`
    - Windows installer: `rtsp-viewer-windows-amd64-installer.exe`
    - macOS universal app: `rtsp-viewer-macos-app.zip`
    - Linux: `rtsp-viewer-linux-x86_64.AppImage`

    Every release artifact has an ASCII-armored detached signature with the
    same filename plus `.asc`. Download both files, recover the signing key
    using any one of these methods, and verify the artifact:

    ```sh
    gpg --keyserver hkps://keys.openpgp.org --recv-keys 7D6EF134D851C8DA0862D97494F31AF374E2EE3C
    # Or:
    gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys 7D6EF134D851C8DA0862D97494F31AF374E2EE3C
    # Or:
    curl --proto '=https' --tlsv1.2 -fsSLo william.asc https://archuser.org/gpg/william.asc
    gpg --import william.asc

    gpg --fingerprint 7D6EF134D851C8DA0862D97494F31AF374E2EE3C
    gpg --verify <artifact>.asc <artifact>
    ```

    Confirm the recovered key fingerprint is exactly
    `7D6E F134 D851 C8DA 0862 D974 94F3 1AF3 74E2 EE3C` before trusting a
    successful signature verification.

    macOS note:
    After unzipping `RTSP Viewer.app`, remove the quarantine flag before first launch:
    `xattr -dr com.apple.quarantine "/path/to/RTSP Viewer.app"`

jobs:
  package:
    name: Package ${{ matrix.package.name }}
    if: ${{ startsWith(forgejo.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.package.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: macOS
            runs_on: macos-latest
            build_shell: bash
            required_tools: base64 curl git gpg jq node npm cargo rustup lipo codesign
            prepare_checkout_command: |
              set -euo pipefail
              for tool in base64 git; do
                if ! command -v "$tool" >/dev/null 2>&1; then
                  echo "Missing required checkout tool: ${tool}. Install Xcode Command Line Tools or provide ${tool} on the macOS runner PATH." >&2
                  exit 1
                fi
              done
            setup_command: |
              set -euo pipefail
              for path_entry in "${HOME}/.cargo/bin" /opt/homebrew/bin /usr/local/bin; do
                if [ -d "$path_entry" ]; then
                  export PATH="${path_entry}:${PATH}"
                  echo "$path_entry" >> "${GITHUB_PATH:-/tmp/github_path}"
                fi
              done
              if ! command -v gpg >/dev/null 2>&1; then
                if ! command -v brew >/dev/null 2>&1; then
                  echo "Missing required macOS signing tool: gpg. Install GnuPG or provide Homebrew on the runner PATH." >&2
                  exit 1
                fi
                HOMEBREW_NO_ASK=1 \
                  HOMEBREW_NO_AUTO_UPDATE=1 \
                  HOMEBREW_NO_ENV_HINTS=1 \
                  brew install gnupg
              fi
              for tool in node npm cargo rustup lipo codesign gpg jq; do
                if ! command -v "$tool" >/dev/null 2>&1; then
                  echo "Missing required macOS build tool after PATH bootstrap: ${tool}" >&2
                  echo "Host-mode Forgejo runners may need ${HOME}/.cargo/bin, /opt/homebrew/bin, or /usr/local/bin added to the service environment." >&2
                  exit 1
                fi
              done
              node_major="$(node -p 'process.versions.node.split(".")[0]')"
              if [ "$node_major" -ne 24 ]; then
                echo "Node.js 24 LTS is required for release builds; found Node.js $(node --version)." >&2
                exit 1
              fi
            build_command: |
              set -euo pipefail
              for path_entry in "${HOME}/.cargo/bin" /opt/homebrew/bin /usr/local/bin; do
                if [ -d "$path_entry" ]; then
                  export PATH="${path_entry}:${PATH}"
                fi
              done
              ./build-helpers/mac/build-app.sh
              mkdir -p dist/releases
              rm -f dist/releases/rtsp-viewer-macos-app.zip
              ditto -c -k --sequesterRsrc --keepParent "dist/macos/RTSP Viewer.app" "dist/releases/rtsp-viewer-macos-app.zip"
            artifact_paths: dist/releases/rtsp-viewer-macos-app.zip
          - name: Windows
            runs_on: ubuntu-22.04
            build_shell: bash
            required_tools: base64 cargo cargo-tauri cargo-xwin curl git gpg jq makensis node npm rustup zip clang-cl llvm-rc lld-link
            prepare_checkout_command: |
              set -euo pipefail
              missing_tools=""
              for tool in base64 curl git jq; do
                if ! command -v "$tool" >/dev/null 2>&1; then
                  missing_tools="${missing_tools} ${tool}"
                fi
              done
              if [ -n "$missing_tools" ]; then
                apt_get="apt-get"
                if command -v sudo >/dev/null 2>&1; then
                  apt_get="sudo apt-get"
                fi
                $apt_get update
                $apt_get install -y --no-install-recommends ca-certificates coreutils curl git jq
              fi
              for tool in base64 curl git jq; do
                if ! command -v "$tool" >/dev/null 2>&1; then
                  echo "Missing required checkout tool after bootstrap: ${tool}" >&2
                  exit 1
                fi
              done
            setup_command: |
              set -euo pipefail
              apt_get="apt-get"
              tee_cmd="tee"
              install_cmd="install"
              chmod_cmd="chmod"
              tool_shim_dir="${HOME}/.local/bin"
              if command -v sudo >/dev/null 2>&1; then
                apt_get="sudo apt-get"
                tee_cmd="sudo tee"
                install_cmd="sudo install"
                chmod_cmd="sudo chmod"
              fi

              mkdir -p "${tool_shim_dir}"
              export PATH="${tool_shim_dir}:${HOME}/.cargo/bin:${PATH}"
              echo "${tool_shim_dir}" >> "${GITHUB_PATH:-/tmp/github_path}"

              link_versioned_tool() {
                tool_name="$1"
                for candidate in "/usr/bin/${tool_name}-"* "/usr/local/bin/${tool_name}-"*; do
                  if [ -x "${candidate}" ]; then
                    ln -sf "${candidate}" "${tool_shim_dir}/${tool_name}"
                    return 0
                  fi
                done
                return 1
              }

              link_tool_alias() {
                alias_name="$1"
                target_name="$2"
                target_path="$(command -v "${target_name}" 2>/dev/null || true)"
                if [ -n "${target_path}" ] && [ -x "${target_path}" ]; then
                  ln -sf "${target_path}" "${tool_shim_dir}/${alias_name}"
                  return 0
                fi
                return 1
              }

              # Install the host-side toolchain required for the Windows cross-build.
              $apt_get update
              $apt_get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                clang \
                coreutils \
                curl \
                git \
                gnupg \
                jq \
                lld \
                llvm \
                nsis \
                zip

              needs_node=1
              if command -v node >/dev/null 2>&1; then
                node_major="$(node -p 'process.versions.node.split(".")[0]')"
                if [ "$node_major" -eq 24 ]; then
                  needs_node=0
                fi
              fi
              if [ "$needs_node" -eq 1 ]; then
                $install_cmd -d -m 0755 /etc/apt/keyrings
                curl --proto '=https' --tlsv1.2 -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
                  | gpg --dearmor \
                  | $tee_cmd /etc/apt/keyrings/nodesource.gpg >/dev/null
                $chmod_cmd a+r /etc/apt/keyrings/nodesource.gpg
                echo 'deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_24.x nodistro main' \
                  | $tee_cmd /etc/apt/sources.list.d/nodesource.list >/dev/null
                $apt_get update
                $apt_get install -y --no-install-recommends nodejs
              fi

              if ! command -v cargo >/dev/null 2>&1 || ! command -v rustup >/dev/null 2>&1; then
                curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
                  | sh -s -- -y --profile minimal --default-toolchain stable
                echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH:-/tmp/github_path}"
                export PATH="${HOME}/.cargo/bin:${PATH}"
              fi
              rustup default stable
              rustup target add x86_64-pc-windows-msvc
              if ! command -v cargo-xwin >/dev/null 2>&1; then
                cargo install --locked cargo-xwin
              fi
              if ! command -v llvm-rc >/dev/null 2>&1; then
                link_versioned_tool llvm-rc || true
              fi
              if ! command -v lld-link >/dev/null 2>&1; then
                link_versioned_tool lld-link || true
              fi
              if ! command -v clang-cl >/dev/null 2>&1; then
                link_versioned_tool clang-cl || true
              fi
              if ! command -v clang-cl >/dev/null 2>&1; then
                link_tool_alias clang-cl clang || true
              fi
              tauri_version=""
              if command -v cargo-tauri >/dev/null 2>&1; then
                tauri_version="$(cargo tauri --version 2>/dev/null || true)"
              fi
              if ! printf '%s' "${tauri_version}" | grep -q '^tauri-cli 2\.'; then
                cargo install --locked --force --version "^2" tauri-cli
              fi
              if ! command -v cargo-xwin >/dev/null 2>&1; then
                echo "Missing cargo-xwin after installation." >&2
                exit 1
              fi
              if ! command -v makensis >/dev/null 2>&1; then
                echo "Missing NSIS compiler after installation: makensis" >&2
                exit 1
              fi
              if ! command -v llvm-rc >/dev/null 2>&1; then
                echo "Missing LLVM resource compiler after installation: llvm-rc" >&2
                exit 1
              fi
              if ! command -v clang-cl >/dev/null 2>&1; then
                echo "Missing clang-cl after installation." >&2
                exit 1
              fi
              node_major="$(node -p 'process.versions.node.split(".")[0]')"
              if [ "$node_major" -ne 24 ]; then
                echo "Node.js 24 LTS is required for release builds; found Node.js $(node --version)." >&2
                exit 1
              fi
            build_command: |
              set -euo pipefail
              export PATH="${HOME}/.cargo/bin:${PATH}"

              npm --prefix ui ci
              npm --prefix ui run build

              export XWIN_CACHE_DIR="${XWIN_CACHE_DIR:-${HOME}/.cache/xwin}"
              cargo fetch --locked --manifest-path src-tauri/Cargo.toml
              cargo tauri build \
                --ci \
                --bundles nsis \
                --config src-tauri/tauri.windows.conf.json \
                --runner cargo-xwin \
                --target x86_64-pc-windows-msvc

              windows_artifact_roots=()
              for artifact_root in target src-tauri/target; do
                if [ -d "${artifact_root}" ]; then
                  windows_artifact_roots+=("${artifact_root}")
                fi
              done
              if [ "${#windows_artifact_roots[@]}" -eq 0 ]; then
                echo "Windows MSVC cross-build did not produce a target directory to inspect." >&2
                exit 1
              fi

              echo "Windows executable candidates:"
              find "${windows_artifact_roots[@]}" \
                -type f \
                -name '*.exe' \
                ! -path '*/deps/*' \
                ! -path '*/bundle/*' \
                -print | sort

              windows_release_bin="target/x86_64-pc-windows-msvc/release/RTSP Viewer.exe"
              if [ ! -f "${windows_release_bin}" ]; then
                echo "Windows MSVC cross-build did not produce ${windows_release_bin}." >&2
                echo "All generated Windows executables:" >&2
                find "${windows_artifact_roots[@]}" -type f -name '*.exe' -print | sort >&2
                exit 1
              fi
              echo "Selected executable: ${windows_release_bin}"

              echo "Searching for WebView2Loader.dll"
              find "${windows_artifact_roots[@]}" -type f -name 'WebView2Loader.dll' -print | sort
              windows_webview2_loader="$(find "${windows_artifact_roots[@]}" \
                -type f \
                -path '*/out/x64/WebView2Loader.dll' \
                -print | sort | sed -n '1p')"
              if [ -z "${windows_webview2_loader}" ]; then
                windows_webview2_loader="$(find "${windows_artifact_roots[@]}" \
                  -type f \
                  -name 'WebView2Loader.dll' \
                  -print | sort | sed -n '1p')"
              fi
              if [ -z "${windows_webview2_loader}" ] || [ ! -f "${windows_webview2_loader}" ]; then
                echo "Windows MSVC cross-build did not produce WebView2Loader.dll." >&2
                exit 1
              fi
              echo "Selected WebView2 loader: ${windows_webview2_loader}"

              echo "Bundle directories:"
              find "${windows_artifact_roots[@]}" -type d -path '*/bundle/*' -print | sort
              echo "Bundle files:"
              find "${windows_artifact_roots[@]}" -type f -path '*/bundle/*' -print | sort

              echo "Searching for NSIS installers"
              find "${windows_artifact_roots[@]}" -type f -path '*/bundle/nsis/*.exe' -print | sort
              windows_installer="$(find "${windows_artifact_roots[@]}" -type f -path '*/bundle/nsis/*.exe' -print | sort | sed -n '1p')"
              if [ -z "${windows_installer}" ] || [ ! -f "${windows_installer}" ]; then
                echo "Windows NSIS cross-build did not produce an installer executable." >&2
                exit 1
              fi
              echo "Selected NSIS installer: ${windows_installer}"

              mkdir -p dist/releases
              windows_output_dir="dist/windows/amd64"
              rm -rf "${windows_output_dir}"
              mkdir -p "${windows_output_dir}"
              install -m 0755 "${windows_release_bin}" "${windows_output_dir}/rtsp-viewer.exe"
              install -m 0644 "${windows_webview2_loader}" "${windows_output_dir}/WebView2Loader.dll"
              rm -f dist/releases/rtsp-viewer-windows-amd64-portable.zip
              zip -j dist/releases/rtsp-viewer-windows-amd64-portable.zip \
                "${windows_output_dir}/rtsp-viewer.exe" \
                "${windows_output_dir}/WebView2Loader.dll"
              install -m 0755 "${windows_installer}" dist/releases/rtsp-viewer-windows-amd64-installer.exe
            artifact_paths: dist/releases/rtsp-viewer-windows-amd64-portable.zip dist/releases/rtsp-viewer-windows-amd64-installer.exe
          - name: Linux AppImage
            runs_on: ubuntu-latest
            build_shell: bash
            required_tools: base64 cargo curl file git gpg jq mksquashfs node npm rustup tar zip
            prepare_checkout_command: |
              set -euo pipefail
              missing_tools=""
              for tool in base64 curl git jq; do
                if ! command -v "$tool" >/dev/null 2>&1; then
                  missing_tools="${missing_tools} ${tool}"
                fi
              done
              if [ -n "$missing_tools" ]; then
                apt_get="apt-get"
                if command -v sudo >/dev/null 2>&1; then
                  apt_get="sudo apt-get"
                fi
                $apt_get update
                $apt_get install -y --no-install-recommends ca-certificates coreutils curl git jq
              fi
              for tool in base64 curl git jq; do
                if ! command -v "$tool" >/dev/null 2>&1; then
                  echo "Missing required checkout tool after bootstrap: ${tool}" >&2
                  exit 1
                fi
              done
            setup_command: |
              set -euo pipefail
              apt_get="apt-get"
              tee_cmd="tee"
              install_cmd="install"
              chmod_cmd="chmod"
              if command -v sudo >/dev/null 2>&1; then
                apt_get="sudo apt-get"
                tee_cmd="sudo tee"
                install_cmd="sudo install"
                chmod_cmd="sudo chmod"
              fi

              export PATH="${HOME}/.cargo/bin:${PATH}"

              # Tauri 2.x uses the WebKitGTK 4.1 / libsoup3 stack on Linux.
              $apt_get update
              $apt_get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                clang \
                coreutils \
                curl \
                file \
                git \
                gnupg \
                jq \
                libayatana-appindicator3-dev \
                libgtk-3-dev \
                libssl-dev \
                libwebkit2gtk-4.1-dev \
                librsvg2-dev \
                squashfs-tools \
                pkg-config \
                tar \
                zip

              needs_node=1
              if command -v node >/dev/null 2>&1; then
                node_major="$(node -p 'process.versions.node.split(".")[0]')"
                if [ "$node_major" -eq 24 ]; then
                  needs_node=0
                fi
              fi
              if [ "$needs_node" -eq 1 ]; then
                $install_cmd -d -m 0755 /etc/apt/keyrings
                curl --proto '=https' --tlsv1.2 -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
                  | gpg --dearmor \
                  | $tee_cmd /etc/apt/keyrings/nodesource.gpg >/dev/null
                $chmod_cmd a+r /etc/apt/keyrings/nodesource.gpg
                echo 'deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_24.x nodistro main' \
                  | $tee_cmd /etc/apt/sources.list.d/nodesource.list >/dev/null
                $apt_get update
                $apt_get install -y --no-install-recommends nodejs
              fi

              if ! command -v cargo >/dev/null 2>&1 || ! command -v rustup >/dev/null 2>&1; then
                curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
                  | sh -s -- -y --profile minimal --default-toolchain stable
                echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH:-/tmp/github_path}"
                export PATH="${HOME}/.cargo/bin:${PATH}"
              fi
              rustup default stable
              node_major="$(node -p 'process.versions.node.split(".")[0]')"
              if [ "$node_major" -ne 24 ]; then
                echo "Node.js 24 LTS is required for release builds; found Node.js $(node --version)." >&2
                exit 1
              fi
            build_command: |
              set -euo pipefail
              export PATH="${HOME}/.cargo/bin:${PATH}"

              npm --prefix ui ci
              npm --prefix ui run build

              cargo build --locked --release -p rtsp_viewer_tauri

              linux_release_bin="target/release/rtsp_viewer_tauri"
              if [ ! -f "${linux_release_bin}" ]; then
                echo "Linux release build did not produce ${linux_release_bin}." >&2
                exit 1
              fi

              version="$(cargo pkgid -p rtsp_viewer_tauri | sed 's/.*@//')"
              mkdir -p dist/releases
              package_root="dist/linux/rtsp-viewer-${version}-linux-x86_64"
              rm -rf "${package_root}"
              mkdir -p "${package_root}"
              install -m 0755 "${linux_release_bin}" "${package_root}/rtsp_viewer_tauri"
              install -m 0644 LICENSE "${package_root}/LICENSE"
              install -m 0644 build-helpers/linux/runtime-notes.txt "${package_root}/README-linux.txt"
              tar -C dist/linux -czf "dist/linux/$(basename "${package_root}").tar.gz" "$(basename "${package_root}")"

              rm -rf dist/linux/packages/appimage
              ./build-helpers/linux/build-package.sh x86_64 appimage

              linux_appimage="$(find dist/linux/packages/appimage -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
              if [ -z "${linux_appimage}" ] || [ ! -f "${linux_appimage}" ]; then
                echo "Linux AppImage packaging did not produce an AppImage artifact." >&2
                exit 1
              fi

              install -m 0755 "${linux_appimage}" dist/releases/rtsp-viewer-linux-x86_64.AppImage
            artifact_paths: dist/releases/rtsp-viewer-linux-x86_64.AppImage

    steps:
      - name: Prepare checkout runtime
        shell: ${{ matrix.package.build_shell }}
        run: |
          ${{ matrix.package.prepare_checkout_command }}
      - name: Check out repository
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail

          for tool in base64 git; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "Missing required checkout tool: ${tool}" >&2
              exit 1
            fi
          done

          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:-}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
          ref="${FORGEJO_REF:-${GITHUB_REF:-}}"
          sha="${FORGEJO_SHA:-${GITHUB_SHA:-}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"

          if [ -z "$server_url" ]; then
            echo "Missing Forgejo server URL." >&2
            exit 1
          fi

          if [ -z "$repository" ]; then
            echo "Missing repository name." >&2
            exit 1
          fi

          case "$server_url" in
            https://*) ;;
            *)
              echo "Repository server URL must use https: ${server_url}" >&2
              exit 1
              ;;
          esac

          remote_url="${server_url%/}/${repository}.git"
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "$remote_url"

          git_fetch() {
            if [ -n "$token" ]; then
              auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"
              git -c "http.${remote_url}.extraheader=AUTHORIZATION: basic ${auth_header}" "$@"
            else
              git "$@"
            fi
          }

          if [ -n "$ref" ]; then
            git_fetch fetch --force --tags --prune --depth=1 origin "+${ref}:${ref}"
            git checkout --force --detach "$ref"
          elif [ -n "$sha" ]; then
            git_fetch fetch --force --tags --prune --depth=1 origin "$sha"
            git checkout --force --detach "$sha"
          else
            echo "Missing both ref and sha for checkout." >&2
            exit 1
          fi

          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Validate GitHub mirror inputs
        shell: bash
        env:
          GH_KEY: ${{ secrets.GH_KEY }}
          GITHUB_MIRROR_REPOSITORY: ${{ env.GITHUB_MIRROR_REPOSITORY }}
        run: |
          set -euo pipefail

          if [ -z "${GH_KEY:-}" ]; then
            echo "Missing required secret: GH_KEY" >&2
            echo "GH_KEY must be able to push refs and publish releases to ${GITHUB_MIRROR_REPOSITORY:-the GitHub mirror repository}." >&2
            exit 1
          fi

          case "${GITHUB_MIRROR_REPOSITORY:-}" in
            */*) ;;
            *)
              echo "GITHUB_MIRROR_REPOSITORY must be in owner/name form." >&2
              exit 1
              ;;
          esac

          mirror_owner="${GITHUB_MIRROR_REPOSITORY%%/*}"
          mirror_repo="${GITHUB_MIRROR_REPOSITORY#*/}"
          if [ -z "$mirror_owner" ] || [ -z "$mirror_repo" ]; then
            echo "GITHUB_MIRROR_REPOSITORY must include both owner and repository name." >&2
            exit 1
          fi

      - name: Validate release signing inputs
        shell: bash
        env:
          CI_KEY: ${{ secrets.CI_KEY }}
          CI_KEY_PASSPHRASE: ${{ secrets.CI_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [ -z "${CI_KEY:-}" ]; then
            echo "Missing required secret: CI_KEY" >&2
            echo "CI_KEY must contain the ASCII-armored private release-signing key or its base64 encoding." >&2
            exit 1
          fi
          if [ -z "${CI_KEY_PASSPHRASE:-}" ]; then
            echo "Missing required secret: CI_KEY_PASSPHRASE" >&2
            echo "CI_KEY_PASSPHRASE must unlock the private release-signing key." >&2
            exit 1
          fi

      - name: Run environment setup
        if: ${{ matrix.package.setup_command != '' }}
        shell: ${{ matrix.package.build_shell }}
        run: ${{ matrix.package.setup_command }}

      - name: Validate packaging inputs
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ matrix.package.artifact_paths }}
          BUILD_COMMAND: ${{ matrix.package.build_command }}
          REQUIRED_TOOLS: ${{ matrix.package.required_tools }}
        run: |
          set -euo pipefail

          if [ -z "${BUILD_COMMAND:-}" ]; then
            echo "Missing matrix build_command for ${RUNNER_OS:-unknown runner OS}." >&2
            exit 1
          fi

          if [ -z "${ARTIFACT_PATHS:-}" ]; then
            echo "Missing matrix artifact_paths for ${RUNNER_OS:-unknown runner OS}." >&2
            exit 1
          fi

          for path_entry in "${HOME}/.local/bin" "${HOME}/.cargo/bin" /opt/homebrew/bin /usr/local/bin; do
            if [ -d "$path_entry" ]; then
              export PATH="${path_entry}:${PATH}"
            fi
          done

          for tool in $REQUIRED_TOOLS; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "Missing required tool: ${tool}" >&2
              exit 1
            fi
          done

      - name: Run build
        shell: ${{ matrix.package.build_shell }}
        run: ${{ matrix.package.build_command }}

      - name: Validate release artifact
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ matrix.package.artifact_paths }}
        run: |
          set -euo pipefail

          for artifact_path in $ARTIFACT_PATHS; do
            if [ ! -f "$artifact_path" ]; then
              echo "Release artifact does not exist or is not a file: ${artifact_path}" >&2
              exit 1
            fi

            if [ ! -s "$artifact_path" ]; then
              echo "Release artifact is empty: ${artifact_path}" >&2
              exit 1
            fi
          done

      - name: Sign and verify release artifacts
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ matrix.package.artifact_paths }}
          CI_KEY: ${{ secrets.CI_KEY }}
          CI_KEY_PASSPHRASE: ${{ secrets.CI_KEY_PASSPHRASE }}
          EXPECTED_SIGNING_FINGERPRINT: ${{ env.RELEASE_SIGNING_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail

          if [ -z "${CI_KEY:-}" ]; then
            echo "Missing required secret: CI_KEY" >&2
            exit 1
          fi
          if [ -z "${CI_KEY_PASSPHRASE:-}" ]; then
            echo "Missing required secret: CI_KEY_PASSPHRASE" >&2
            exit 1
          fi

          signing_home="$(mktemp -d "${RUNNER_TEMP:-/tmp}/rtsp-viewer-gnupg.XXXXXX")"
          key_file="${signing_home}/release-signing-key"
          cleanup_signing_home() {
            rm -rf "${signing_home}"
          }
          trap cleanup_signing_home EXIT
          chmod 0700 "${signing_home}"
          export GNUPGHOME="${signing_home}"

          case "$CI_KEY" in
            *'-----BEGIN PGP PRIVATE KEY BLOCK-----'*)
              printf '%s' "$CI_KEY" > "$key_file"
              ;;
            *)
              if ! printf '%s' "$CI_KEY" | base64 --decode > "$key_file" 2>/dev/null; then
                printf '%s' "$CI_KEY" | base64 -D > "$key_file"
              fi
              ;;
          esac

          gpg --batch --import "$key_file"
          rm -f "$key_file"

          if ! gpg --batch --with-colons --fingerprint --list-secret-keys \
            | awk -F: -v expected="$EXPECTED_SIGNING_FINGERPRINT" \
                '$1 == "fpr" && toupper($10) == expected { found = 1 } END { exit !found }'; then
            echo "CI_KEY does not contain the expected signing key: ${EXPECTED_SIGNING_FINGERPRINT}" >&2
            exit 1
          fi

          for artifact_path in $ARTIFACT_PATHS; do
            signature_path="${artifact_path}.asc"
            rm -f "$signature_path"
            gpg --batch --yes --armor --detach-sign \
              --pinentry-mode loopback \
              --passphrase-fd 0 \
              --local-user "$EXPECTED_SIGNING_FINGERPRINT" \
              --output "$signature_path" \
              "$artifact_path" \
              < <(printf '%s' "$CI_KEY_PASSPHRASE")
            gpg --batch --verify "$signature_path" "$artifact_path"
            if [ ! -s "$signature_path" ]; then
              echo "Detached signature is missing or empty: ${signature_path}" >&2
              exit 1
            fi
          done

      - name: Publish Forgejo release
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ matrix.package.artifact_paths }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          INPUT_RELEASE_BODY: ${{ env.RELEASE_BODY }}
        run: |
          set -euo pipefail

          api_url="${FORGEJO_API_URL:-${GITHUB_API_URL:?Missing Forgejo API URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          tag="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:-}}"
          if [ -z "$tag" ]; then
            tag="${FORGEJO_REF:-${GITHUB_REF:-}}"
            tag="${tag#refs/tags/}"
          fi
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          owner="${repository%%/*}"
          repo="${repository#*/}"
          asset_paths="${ARTIFACT_PATHS:?Missing artifact paths}"
          release_name="RTSP Viewer ${tag}"
          release_body="${INPUT_RELEASE_BODY:-Automated release for ${tag}.}"

          case "$api_url" in
            https://*) ;;
            *)
              echo "Forgejo API URL must use https: ${api_url}" >&2
              exit 1
              ;;
          esac

          if [ -z "$tag" ]; then
            echo "Missing release tag. Run this workflow on a tag ref." >&2
            exit 1
          fi

          release_payload="$(jq -n \
            --arg tag "$tag" \
            --arg name "$release_name" \
            --arg body "$release_body" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false, hide_archive_links: false}')"

          api_request() {
            local method="$1"
            local url="$2"
            shift 2
            curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
              --request "$method" \
              --header "Authorization: token ${token}" \
              "$@" \
              "$url"
          }

          fetch_release_by_tag() {
            local response_file
            local status

            response_file="$(mktemp)"
            status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --header "Authorization: token ${token}" \
              "${api_url}/repos/${owner}/${repo}/releases/tags/${tag}")"

            if [ "$status" = "200" ]; then
              cat "$response_file"
              return 0
            fi

            if [ "$status" = "404" ]; then
              return 1
            fi

            cat "$response_file" >&2
            echo "Failed to look up release for ${tag}: HTTP ${status}" >&2
            exit 1
          }

          create_release() {
            local response_file
            local status

            response_file="$(mktemp)"
            status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: token ${token}" \
              --header "Content-Type: application/json" \
              --data "$release_payload" \
              "${api_url}/repos/${owner}/${repo}/releases")"

            if [ "$status" = "200" ] || [ "$status" = "201" ]; then
              cat "$response_file"
              return 0
            fi

            if [ "$status" = "409" ] || [ "$status" = "422" ]; then
              if release_json="$(fetch_release_by_tag)"; then
                printf '%s' "$release_json"
                return 0
              fi
            fi

            cat "$response_file" >&2
            echo "Failed to create release for ${tag}: HTTP ${status}" >&2
            exit 1
          }

          if release_json="$(fetch_release_by_tag)"; then
            release_id="$(printf '%s' "$release_json" | jq -r '.id')"
            release_json="$(api_request PATCH "${api_url}/repos/${owner}/${repo}/releases/${release_id}" \
              --header "Content-Type: application/json" \
              --data "$release_payload")"
          else
            release_json="$(create_release)"
          fi

          release_id="$(printf '%s' "$release_json" | jq -r '.id')"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "Release response did not include an id." >&2
            exit 1
          fi

          for artifact_path in $asset_paths; do
            for asset_path in "$artifact_path" "${artifact_path}.asc"; do
              if [ ! -s "$asset_path" ]; then
                echo "Release asset does not exist or is empty: ${asset_path}" >&2
                exit 1
              fi

              asset_name="$(basename "$asset_path")"
              asset_name_encoded="$(jq -nr --arg value "$asset_name" '$value|@uri')"
              existing_asset_id="$(api_request GET "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets" \
                | jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .id' \
                | head -n 1)"

              if [ -n "$existing_asset_id" ]; then
                api_request DELETE "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets/${existing_asset_id}" >/dev/null
              fi

              api_request POST "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets?name=${asset_name_encoded}" \
                --form "attachment=@${asset_path}" >/dev/null
            done
          done

      - name: Mirror repository to GitHub
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          GH_KEY: ${{ secrets.GH_KEY }}
          GITHUB_MIRROR_REPOSITORY: ${{ env.GITHUB_MIRROR_REPOSITORY }}
        run: |
          set -euo pipefail

          github_repository="${GITHUB_MIRROR_REPOSITORY:?Missing GitHub mirror repository}"
          github_owner="${github_repository%%/*}"
          github_repo="${github_repository#*/}"
          github_api_url="https://api.github.com"
          github_remote_url="https://github.com/${github_owner}/${github_repo}.git"
          github_token="${GH_KEY:?Missing GH_KEY secret for GitHub mirroring}"

          forgejo_server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:-}}"
          forgejo_repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
          forgejo_token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"

          if [ -z "$forgejo_server_url" ]; then
            echo "Missing Forgejo server URL." >&2
            exit 1
          fi

          if [ -z "$forgejo_repository" ]; then
            echo "Missing Forgejo repository name." >&2
            exit 1
          fi

          case "$github_remote_url" in
            https://*) ;;
            *)
              echo "GitHub remote URL must use https: ${github_remote_url}" >&2
              exit 1
              ;;
          esac

          github_request() {
            local method="$1"
            local url="$2"
            local response_file
            local status
            shift 2
            response_file="$(mktemp)"
            status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request "$method" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${github_token}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$@" \
              "$url")"
            if [ "$status" -lt 200 ] || [ "$status" -gt 299 ]; then
              cat "$response_file" >&2
              echo "GitHub API request failed: ${method} ${url} returned HTTP ${status}" >&2
              exit 1
            fi
            cat "$response_file"
          }

          github_repo_status() {
            local response_file
            response_file="$(mktemp)"
            curl --proto '=https' --tlsv1.2 --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${github_token}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${github_api_url}/repos/${github_owner}/${github_repo}"
          }

          ensure_github_repository() {
            local repo_status
            local owner_json
            local owner_type
            local create_payload
            local create_response_file
            local create_status

            repo_status="$(github_repo_status)"
            if [ "$repo_status" = "200" ]; then
              return 0
            fi
            if [ "$repo_status" != "404" ]; then
              echo "Failed to check GitHub repository ${github_repository}: HTTP ${repo_status}" >&2
              exit 1
            fi

            owner_json="$(github_request GET "${github_api_url}/users/${github_owner}")"
            owner_type="$(printf '%s' "$owner_json" | jq -r '.type')"
            create_payload="$(jq -n \
              --arg name "$github_repo" \
              --arg description "RTSP Viewer desktop app" \
              '{name: $name, description: $description, private: false, auto_init: false}')"
            create_response_file="$(mktemp)"

            if [ "$owner_type" = "Organization" ]; then
              create_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
                --output "$create_response_file" \
                --write-out "%{http_code}" \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${github_token}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "Content-Type: application/json" \
                --data "$create_payload" \
                "${github_api_url}/orgs/${github_owner}/repos")"
            elif [ "$owner_type" = "User" ]; then
              authenticated_login="$(github_request GET "${github_api_url}/user" | jq -r '.login')"
              if [ "$authenticated_login" != "$github_owner" ]; then
                echo "Cannot create ${github_repository}: GH_KEY authenticates as ${authenticated_login}, not ${github_owner}." >&2
                exit 1
              fi
              create_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
                --output "$create_response_file" \
                --write-out "%{http_code}" \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${github_token}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "Content-Type: application/json" \
                --data "$create_payload" \
                "${github_api_url}/user/repos")"
            else
              echo "Unsupported GitHub owner type for ${github_owner}: ${owner_type}" >&2
              exit 1
            fi

            if [ "$create_status" = "200" ] || [ "$create_status" = "201" ]; then
              return 0
            fi
            if [ "$create_status" = "409" ] || [ "$create_status" = "422" ]; then
              repo_status="$(github_repo_status)"
              if [ "$repo_status" = "200" ]; then
                return 0
              fi
            fi

            cat "$create_response_file" >&2
            echo "Failed to create GitHub repository ${github_repository}: HTTP ${create_status}" >&2
            exit 1
          }

          git_push_github() {
            local auth_header
            auth_header="$(printf 'x-access-token:%s' "$github_token" | base64 | tr -d '\n')"
            git -c "http.${github_remote_url}.extraheader=AUTHORIZATION: basic ${auth_header}" \
              push "$github_remote_url" "$@"
          }

          fetch_forgejo_refs() {
            local forgejo_remote_url="${forgejo_server_url%/}/${forgejo_repository}.git"
            case "$forgejo_remote_url" in
              https://*) ;;
              *)
                echo "Forgejo remote URL must use https: ${forgejo_remote_url}" >&2
                exit 1
                ;;
            esac

            if [ -n "$forgejo_token" ]; then
              forgejo_auth_header="$(printf 'x-access-token:%s' "$forgejo_token" | base64 | tr -d '\n')"
              git -c "http.${forgejo_remote_url}.extraheader=AUTHORIZATION: basic ${forgejo_auth_header}" \
                fetch --force --tags --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
            else
              git fetch --force --tags --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
            fi
          }

          ensure_github_repository
          fetch_forgejo_refs

          branch_refspecs=()
          while read -r ref_name short_name; do
            short_name="${short_name#origin/}"
            if [ "$short_name" = "HEAD" ]; then
              continue
            fi
            branch_refspecs+=("${ref_name}:refs/heads/${short_name}")
          done < <(git for-each-ref --format='%(refname) %(refname:short)' refs/remotes/origin)

          if [ "${#branch_refspecs[@]}" -gt 0 ]; then
            git_push_github "${branch_refspecs[@]}"
          else
            echo "No Forgejo branches were found to mirror." >&2
            exit 1
          fi

          git_push_github "refs/tags/*:refs/tags/*"

      - name: Publish GitHub release assets
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ matrix.package.artifact_paths }}
          GH_KEY: ${{ secrets.GH_KEY }}
          GITHUB_MIRROR_REPOSITORY: ${{ env.GITHUB_MIRROR_REPOSITORY }}
          INPUT_RELEASE_BODY: ${{ env.RELEASE_BODY }}
        run: |
          set -euo pipefail

          github_repository="${GITHUB_MIRROR_REPOSITORY:?Missing GitHub mirror repository}"
          owner="${github_repository%%/*}"
          repo="${github_repository#*/}"
          api_url="https://api.github.com"
          upload_url="https://uploads.github.com"
          tag="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:-}}"
          if [ -z "$tag" ]; then
            tag="${FORGEJO_REF:-${GITHUB_REF:-}}"
            tag="${tag#refs/tags/}"
          fi
          token="${GH_KEY:?Missing GH_KEY secret for GitHub release publishing}"
          asset_paths="${ARTIFACT_PATHS:?Missing artifact paths}"
          release_name="RTSP Viewer ${tag}"
          release_body="${INPUT_RELEASE_BODY:-Automated release for ${tag}.}"

          if [ -z "$tag" ]; then
            echo "Missing release tag. Run this workflow on a tag ref." >&2
            exit 1
          fi

          github_request() {
            local method="$1"
            local url="$2"
            local response_file
            local status
            shift 2
            response_file="$(mktemp)"
            status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request "$method" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${token}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$@" \
              "$url")"
            if [ "$status" -lt 200 ] || [ "$status" -gt 299 ]; then
              cat "$response_file" >&2
              echo "GitHub API request failed: ${method} ${url} returned HTTP ${status}" >&2
              exit 1
            fi
            cat "$response_file"
          }

          fetch_release_by_tag() {
            local response_file
            local status

            response_file="$(mktemp)"
            status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${token}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${api_url}/repos/${owner}/${repo}/releases/tags/${tag}")"

            if [ "$status" = "200" ]; then
              cat "$response_file"
              return 0
            fi
            if [ "$status" = "404" ]; then
              return 1
            fi

            cat "$response_file" >&2
            echo "Failed to look up GitHub release for ${tag}: HTTP ${status}" >&2
            exit 1
          }

          release_payload="$(jq -n \
            --arg tag "$tag" \
            --arg name "$release_name" \
            --arg body "$release_body" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false, make_latest: "true"}')"

          create_release() {
            local response_file
            local status

            response_file="$(mktemp)"
            status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${token}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data "$release_payload" \
              "${api_url}/repos/${owner}/${repo}/releases")"

            if [ "$status" = "200" ] || [ "$status" = "201" ]; then
              cat "$response_file"
              return 0
            fi
            if [ "$status" = "409" ] || [ "$status" = "422" ]; then
              if release_json="$(fetch_release_by_tag)"; then
                printf '%s' "$release_json"
                return 0
              fi
            fi

            cat "$response_file" >&2
            echo "Failed to create GitHub release for ${tag}: HTTP ${status}" >&2
            exit 1
          }

          if release_json="$(fetch_release_by_tag)"; then
            release_id="$(printf '%s' "$release_json" | jq -r '.id')"
            release_json="$(github_request PATCH "${api_url}/repos/${owner}/${repo}/releases/${release_id}" \
              --header "Content-Type: application/json" \
              --data "$release_payload")"
          else
            release_json="$(create_release)"
          fi

          release_id="$(printf '%s' "$release_json" | jq -r '.id')"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "GitHub release response did not include an id." >&2
            exit 1
          fi

          for artifact_path in $asset_paths; do
            for asset_path in "$artifact_path" "${artifact_path}.asc"; do
              if [ ! -s "$asset_path" ]; then
                echo "GitHub release asset does not exist or is empty: ${asset_path}" >&2
                exit 1
              fi

              asset_name="$(basename "$asset_path")"
              asset_name_encoded="$(jq -nr --arg value "$asset_name" '$value|@uri')"
              existing_asset_id="$(github_request GET "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets" \
                | jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .id' \
                | head -n 1)"

              if [ -n "$existing_asset_id" ]; then
                github_request DELETE "${api_url}/repos/${owner}/${repo}/releases/assets/${existing_asset_id}" >/dev/null
              fi

              github_request POST "${upload_url}/repos/${owner}/${repo}/releases/${release_id}/assets?name=${asset_name_encoded}" \
                --header "Content-Type: application/octet-stream" \
                --data-binary "@${asset_path}" >/dev/null
            done
          done
